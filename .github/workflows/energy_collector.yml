name: Energy HTTP collector

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: energy-data-live-publisher
  cancel-in-progress: false

permissions:
  contents: write

env:
  LIVE_BRANCH: live-data

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run safety tests
        run: python -m unittest discover -s tests -v

      - name: Collect current measurements
        run: python collect_once.py

      - name: Validate generated outputs
        run: python validate_outputs.py

      - name: Publish validated snapshot to live-data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          snapshot=$(mktemp -d)
          cp -a data results "$snapshot/"
          git fetch origin "$LIVE_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$LIVE_BRANCH"; then
            git switch -C "$LIVE_BRANCH" "origin/$LIVE_BRANCH"
          else
            git switch --orphan "$LIVE_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf data results
          cp -a "$snapshot/data" data
          cp -a "$snapshot/results" results
          rm -rf "$snapshot"
          git add data results
          if git diff --cached --quiet; then
            echo 'No data changes to publish.'
            exit 0
          fi
          git commit -m "Publish live energy data"
          git push --force-with-lease origin "$LIVE_BRANCH"

      - name: Write run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          health = json.load(open('results/health.json', encoding='utf-8'))
          quality = health.get('data_quality', {})
          print('## Live energy publication')
          print(f"- Published branch: `live-data`")
          print(f"- Collector: **{health.get('collector_status')}**")
          print(f"- Generated: **{health.get('last_run')}**")
          print(f"- Data quality: **{quality.get('score', 'n/a')}%**")
          print(f"- Completed hours: **{quality.get('completed_hours', 'n/a')}**")
          PY
