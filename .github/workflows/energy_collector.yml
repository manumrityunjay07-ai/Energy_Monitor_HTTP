name: Energy HTTP collector

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: energy-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run safety tests
        run: python -m unittest discover -s tests -v

      - name: Collect and infer
        run: python collect_once.py

      - name: Validate published outputs
        run: python validate_outputs.py

      - name: Write run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          health = json.load(open('results/health.json', encoding='utf-8'))
          quality = health.get('data_quality', {})
          print('## Energy collector summary')
          print(f"- Collector: **{health.get('collector_status')}**")
          print(f"- Data quality: **{quality.get('score', 'n/a')}%**")
          print(f"- Missing hours: **{health.get('missing_hours', [])}**")
          print(f"- Learning status: **{health.get('learning_status')}**")
          print(f"- Learning samples: **{health.get('learning_samples')}**")
          print(f"- Model guard: `{health.get('rollback_guard')}`")
          PY

      - name: Commit persisted state and results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config pull.rebase true
          git add -A data results
          if git diff --cached --quiet; then
            echo "No state or result changes to commit."
          else
            git commit -m "Update energy data and AI results"
            pushed=false
            for attempt in 1 2 3 4 5; do
              echo "Publishing attempt ${attempt}/5"
              if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Publish attempt ${attempt} failed; retrying after remote synchronization."
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            if [ "$pushed" != true ]; then
              echo "ERROR: collection succeeded but publishing failed after 5 attempts."
              exit 1
            fi
          fi
