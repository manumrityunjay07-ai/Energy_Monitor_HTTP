name: Energy HTTP collector

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: energy-data-publisher
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run safety tests
        run: python -m unittest discover -s tests -v

      - name: Collect and infer
        run: python collect_once.py

      - name: Validate published outputs
        run: python validate_outputs.py

      - name: Write run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          health = json.load(open('results/health.json', encoding='utf-8'))
          quality = health.get('data_quality', {})
          print('## Energy collector summary')
          print(f"- Collector: **{health.get('collector_status')}**")
          print(f"- Data quality: **{quality.get('score', 'n/a')}%**")
          print(f"- Missing hours: **{health.get('missing_hours', [])}**")
          print(f"- Learning status: **{health.get('learning_status')}**")
          print(f"- Learning samples: **{health.get('learning_samples')}**")
          print(f"- Model guard: `{health.get('rollback_guard')}`")
          PY

      - name: Commit persisted state and results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data results
          if git diff --cached --quiet; then
            echo "No state or result changes to commit."
          else
            branch="automation/energy-data-${GITHUB_RUN_ID}"
            git switch -c "$branch"
            git commit -m "Update energy data and AI results"
            git push --set-upstream origin "$branch"
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Automated energy data update (${GITHUB_RUN_ID})" \
              --body "Automated collector run ${GITHUB_RUN_ID} passed collection, safety tests, and validate_outputs.py. Please review and merge this data-only update into main."
          fi
